[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-graph-dijkstra-astar-pathfinder-skill"
version = "1.0.0"
description = "Graph pathfinding engine implementing Dijkstra's shortest path and A* heuristic routing with priority queues for agent planning."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
